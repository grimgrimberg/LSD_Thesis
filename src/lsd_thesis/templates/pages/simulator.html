{% extends "base.html" %}
{% block content %}
<section class="content-grid content-grid--wide">
  <article class="panel">
    <div class="panel-heading">
      <h2>Illustrative Simulator Controls</h2>
      <span id="simulator_status" class="status-token">ready</span>
    </div>
    <div class="control-stack" id="simulator_controls">
      <label>Regime<select id="sim_regime"><option value="baseline">Baseline</option><option value="perturbed">Perturbed</option></select></label>
      <label>Within scale<input id="sim_within" type="range" min="0" max="2" step="0.05" value="1"></label>
      <label>Cross scale<input id="sim_cross" type="range" min="0" max="2" step="0.05" value="1"></label>
      <label>Constraint<input id="sim_constraint" type="range" min="0" max="2" step="0.05" value="1"></label>
      <label>Temperature<input id="sim_temperature" type="range" min="0.01" max="2" step="0.01" value="0.1"></label>
      <button id="run_simulation" class="primary-button" type="button">Run Simulation</button>
    </div>
  </article>
  <article class="panel panel--span-2">
    <div class="panel-heading">
      <h2>Latent Activity</h2>
      <span class="status-token status-token--teal">model proxy</span>
    </div>
    <div class="chart-frame">
      <div id="sim_time_chart" class="chart" role="img" aria-label="Simulator time series">Loading...</div>
    </div>
  </article>
  <article class="panel panel--span-3">
    <div class="panel-heading">
      <h2>Functional Coupling Matrix</h2>
      <span class="status-token status-token--amber">unitless</span>
    </div>
    <div class="chart-frame chart-frame--matrix">
      <div id="sim_fc_chart" class="chart matrix-chart" role="img" aria-label="Simulator FC matrix">Loading...</div>
    </div>
  </article>
</section>
{% endblock %}
