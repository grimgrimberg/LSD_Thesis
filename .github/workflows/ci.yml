name: CI Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install uv
        run: python -m pip install uv

      - name: Install Python dependencies
        run: uv sync --frozen --extra dev

      - name: Install PPTX dependencies
        run: npm ci --prefix tools/pptx

      - name: Check Python package environment
        run: uv pip check

      - name: Lint Python
        run: uv run ruff check .

      - name: Type check Python
        run: uv run mypy src

      - name: Audit PPTX dependencies
        run: npm audit --prefix tools/pptx --audit-level=moderate

      - name: Run Python tests
        run: uv run pytest

      - name: Check dashboard preflight
        run: uv run python scripts/preview_dashboard.py --check-only --strict

      - name: Check PPTX generator syntax
        run: npm test --prefix tools/pptx
