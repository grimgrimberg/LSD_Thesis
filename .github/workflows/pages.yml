name: Build GitHub Pages Static Site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install PPTX dependencies
        run: npm ci --prefix tools/pptx

      - name: Build static thesis site
        run: uv run python scripts/build_github_pages.py

      - name: Upload static site artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-thesis-site
          path: _site
